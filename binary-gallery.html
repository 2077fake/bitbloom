<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>二进制画廊 · 1024 造物挑战</title>
<style>
:root{
  --bg1:#fff7ec; --bg2:#ffe9f0; --card:#ffffff; --ink:#2b2b3a;
  --accent:#ff6b8a; --accent2:#36c5b0; --accent3:#ffc24b; --line:#ffe1c4;
  --muted:#8a8a9a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--ink); min-height:100vh; padding:16px;
}
.wrap{max-width:880px; margin:0 auto;}
header{text-align:center; margin-bottom:14px;}
.logo{font-size:30px; font-weight:800; letter-spacing:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent3),var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent;}
.badge{display:inline-block; margin-top:6px; padding:5px 14px; border-radius:999px;
  background:var(--accent3); color:#5a3b00; font-size:12px; font-weight:700;}
.card{background:var(--card); border-radius:18px; padding:16px;
  box-shadow:0 8px 24px rgba(255,140,150,.18); margin-bottom:14px;}
.tabs{display:flex; gap:8px; margin-bottom:12px;}
.tab{flex:1; text-align:center; padding:11px; border-radius:12px; background:#fff0f3;
  color:var(--muted); font-weight:700; cursor:pointer; border:2px solid transparent; transition:.2s; font-size:15px;}
.tab.active{background:#fff; color:var(--accent); border-color:var(--accent);}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px;}
.field{display:flex; flex-direction:column; gap:6px; flex:1; min-width:120px;}
label{font-size:13px; color:var(--muted); font-weight:600;}
textarea,input[type=text]{width:100%; border:2px solid var(--line); border-radius:12px;
  padding:10px; font-size:15px; resize:vertical; font-family:inherit; background:#fffdf8;}
input[type=range]{width:100%; accent-color:var(--accent);}
select{border:2px solid var(--line); border-radius:10px; padding:9px 10px; font-size:14px; background:#fff; width:100%;}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}
button{cursor:pointer; border:none; border-radius:12px; padding:11px 18px; font-weight:700;
  font-size:14px; transition:.15s; flex:1; min-width:120px;}
.btn-primary{background:linear-gradient(90deg,var(--accent),#ff8aa3); color:#fff;
  box-shadow:0 6px 16px rgba(255,107,138,.35);}
.btn-ghost{background:#fff0f3; color:var(--accent);}
button:active{transform:translateY(1px);}
.swatches{display:flex; gap:8px; flex-wrap:wrap;}
.swatch{width:30px; height:30px; border-radius:9px; cursor:pointer; border:3px solid #fff;
  box-shadow:0 0 0 2px var(--line);}
.swatch.active{box-shadow:0 0 0 3px var(--accent);}
.canvas-box{background:#fffdf8; border:2px dashed var(--line); border-radius:14px;
  padding:12px; text-align:center; overflow:auto;}
canvas{max-width:100%; height:auto; image-rendering:pixelated; border-radius:8px; background:#fff; display:inline-block;}
.gallery{display:flex; gap:10px; flex-wrap:wrap;}
.gitem{flex:1; min-width:96px; text-align:center; cursor:pointer; border:2px solid var(--line);
  border-radius:12px; padding:8px; background:#fff; transition:.15s;}
.gitem:hover{border-color:var(--accent);}
.gitem canvas{width:100%; height:auto; image-rendering:pixelated;}
.gitem span{font-size:12px; color:var(--muted); display:block; margin-top:4px;}
.hint{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.6;}
.title-sm{font-size:15px; font-weight:700; margin:0 0 10px; color:var(--ink);}
footer{text-align:center; color:var(--muted); font-size:12px; margin:18px 0 8px;}
.hide{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">二进制画廊</div>
    <div class="badge">用 WorkBuddy 打造 · 1024 造物挑战</div>
  </header>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-mode="text">文字字节画</div>
      <div class="tab" data-mode="image">图片字节画</div>
    </div>

    <!-- 文字模式 -->
    <div id="panel-text">
      <div class="field" style="width:100%;">
        <label>输入文字（任意语言，实时生成二进制画）</label>
        <textarea id="textInput" rows="3" placeholder="写点什么，比如：1024 程序员节 快乐">1024 造物挑战</textarea>
      </div>
      <div class="row" style="margin-top:12px;">
        <div class="field">
          <label>网格密度（列数）</label>
          <input type="range" id="textCols" min="16" max="48" value="28">
        </div>
        <div class="field">
          <label>画面风格</label>
          <select id="textStyle">
            <option value="block">实心方块</option>
            <option value="dot">圆点</option>
            <option value="char">01 字符</option>
          </select>
        </div>
      </div>
      <div class="field" style="width:100%;">
        <label>配色</label>
        <div class="swatches" id="textSwatches"></div>
      </div>
    </div>

    <!-- 图片模式 -->
    <div id="panel-image" class="hide">
      <div class="btnrow" style="margin-bottom:12px;">
        <button class="btn-ghost" id="uploadBtn">上传图片</button>
        <input type="file" id="fileInput" accept="image/*" class="hide">
      </div>
      <div class="row">
        <div class="field">
          <label>像素网格（N×N）</label>
          <input type="range" id="imgGrid" min="16" max="96" value="48">
        </div>
        <div class="field">
          <label>明暗阈值</label>
          <input type="range" id="imgThresh" min="0" max="100" value="50">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>画面风格</label>
          <select id="imgStyle">
            <option value="block">实心方块</option>
            <option value="dot">圆点</option>
            <option value="char">01 字符</option>
          </select>
        </div>
        <div class="field">
          <label>反相（暗变亮）</label>
          <select id="imgInvert">
            <option value="0">关</option>
            <option value="1">开</option>
          </select>
        </div>
      </div>
      <div class="field" style="width:100%;">
        <label>配色</label>
        <div class="swatches" id="imgSwatches"></div>
      </div>
    </div>

    <div class="btnrow" style="margin-top:14px;">
      <button class="btn-primary" id="exportBtn">导出 PNG（中文文件名）</button>
    </div>
  </div>

  <div class="card">
    <p class="title-sm">实时预览</p>
    <div class="canvas-box">
      <canvas id="preview"></canvas>
    </div>
    <p class="hint">导出文件自动命名为「二进制画廊_模式_日期.png」，可直接分享到 1024 造物挑战投稿。</p>
  </div>

  <div class="card">
    <p class="title-sm">灵感画廊（点击试玩）</p>
    <div class="gallery" id="gallery"></div>
  </div>

  <footer>二进制画廊 · 由 WorkBuddy 在程序员节为你造物</footer>
</div>

<script>
"use strict";

var PALETTES = {
  sakura:  { name:"樱花粉", lit:"#ff6b8a", bg:"#fff0f4" },
  sky:     { name:"晴空蓝", lit:"#2f9bff", bg:"#eaf4ff" },
  mint:    { name:"薄荷绿", lit:"#1fbf8f", bg:"#e8fbf3" },
  amber:   { name:"琥珀橙", lit:"#ff9f1c", bg:"#fff3e0" },
  grape:   { name:"葡萄紫", lit:"#9b6bff", bg:"#f3ecff" },
  mono:    { name:"极简单色", lit:"#2b2b3a", bg:"#ffffff" }
};
var PALETTE_KEYS = Object.keys(PALETTES);

var HEART = [
  "01101101100",
  "11111111110",
  "11111111110",
  "11111111110",
  "01111111100",
  "00111111000",
  "00011110000",
  "00001100000",
  "00000100000"
];

var state = {
  mode: "text",
  palette: "sakura",
  text: { cols: 28, style: "block" },
  image: { grid: 48, thresh: 50, style: "block", invert: 0 },
  lastImage: null
};

var preview = document.getElementById("preview");
var textInput = document.getElementById("textInput");
var textCols = document.getElementById("textCols");
var textStyle = document.getElementById("textStyle");
var imgGrid = document.getElementById("imgGrid");
var imgThresh = document.getElementById("imgThresh");
var imgStyle = document.getElementById("imgStyle");
var imgInvert = document.getElementById("imgInvert");
var fileInput = document.getElementById("fileInput");

/* ---------- 渲染核心 ---------- */
function renderGrid(grid, opts){
  opts = opts || {};
  var cell = opts.cell || 18;
  var pal = PALETTES[opts.palette] || PALETTES.sakura;
  var lit = opts.lit || pal.lit;
  var bg  = opts.bg  || pal.bg;
  var style = opts.style || "block";
  var watermark = opts.watermark !== false;
  var overlay = opts.overlay || null;

  var rows = grid.length;
  var cols = grid[0] ? grid[0].length : 0;
  var wmH = watermark ? Math.round(cell * 1.7) : 0;
  var W = cols * cell;
  var H = rows * cell + wmH;

  preview.width = W;
  preview.height = H;
  var x = preview.getContext("2d");
  x.fillStyle = bg;
  x.fillRect(0, 0, W, H);

  for (var r = 0; r < rows; r++){
    for (var c = 0; c < cols; c++){
      if (!grid[r][c]) continue;
      var px = c * cell, py = r * cell;
      if (style === "block"){
        x.fillStyle = lit;
        x.fillRect(px + 1, py + 1, cell - 2, cell - 2);
      } else if (style === "dot"){
        x.fillStyle = lit;
        x.beginPath();
        x.arc(px + cell/2, py + cell/2, cell * 0.38, 0, Math.PI * 2);
        x.fill();
      } else if (style === "char"){
        x.fillStyle = lit;
        x.font = "bold " + Math.floor(cell * 0.82) + "px monospace";
        x.textAlign = "center";
        x.textBaseline = "middle";
        x.fillText("1", px + cell/2, py + cell/2 + 1);
      }
    }
  }

  if (overlay){
    x.save();
    x.globalAlpha = 0.15;
    x.fillStyle = lit;
    var fs = Math.min(W * 0.16, H * 0.42);
    x.font = "bold " + fs + "px -apple-system,'PingFang SC',sans-serif";
    x.textAlign = "center";
    x.textBaseline = "middle";
    x.fillText(overlay, W/2, (H - wmH)/2);
    x.restore();
  }

  if (wmH){
    var wy = rows * cell;
    x.fillStyle = "rgba(0,0,0,0.04)";
    x.fillRect(0, wy, W, wmH);
    x.fillStyle = lit;
    x.font = "bold 14px -apple-system,'PingFang SC',sans-serif";
    x.textAlign = "left";
    x.textBaseline = "middle";
    x.fillText("二进制画廊", 12, wy + wmH/2);
    x.fillStyle = "#9a9aa8";
    x.font = "12px -apple-system,'PingFang SC',sans-serif";
    x.textAlign = "right";
    x.fillText("WorkBuddy · 1024 造物挑战", W - 12, wy + wmH/2);
  }
}

/* ---------- 文字 -> 二进制网格 ---------- */
function textToGrid(text, cols){
  var enc = new TextEncoder();
  var bytes = enc.encode(text && text.length ? text : " ");
  var bits = [];
  for (var i = 0; i < bytes.length; i++){
    var b = bytes[i];
    for (var k = 7; k >= 0; k--) bits.push((b >> k) & 1);
  }
  if (cols < 8) cols = 8;
  if (cols > 64) cols = 64;
  var rows = Math.ceil(bits.length / cols);
  var grid = [];
  var idx = 0;
  for (var r = 0; r < rows; r++){
    var row = [];
    for (var c = 0; c < cols; c++) row.push(bits[idx++] || 0);
    grid.push(row);
  }
  return grid;
}

/* ---------- 图片 -> 二进制网格 ---------- */
function imageToGrid(img, n, thresh, invert){
  var off = document.createElement("canvas");
  off.width = n; off.height = n;
  var o = off.getContext("2d");
  o.drawImage(img, 0, 0, n, n);
  var data = o.getImageData(0, 0, n, n).data;
  var grid = [];
  for (var r = 0; r < n; r++){
    var row = [];
    for (var c = 0; c < n; c++){
      var i = (r * n + c) * 4;
      var lum = (0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]) / 255;
      var v = lum > (thresh / 100) ? 1 : 0;
      if (invert) v = 1 - v;
      row.push(v);
    }
    grid.push(row);
  }
  return grid;
}

/* ---------- 模式渲染 ---------- */
function renderText(){
  var grid = textToGrid(textInput.value, parseInt(textCols.value, 10));
  state.text.cols = parseInt(textCols.value, 10);
  state.text.style = textStyle.value;
  renderGrid(grid, {
    palette: state.palette,
    style: textStyle.value,
    overlay: textInput.value && textInput.value.trim().length ? textInput.value.trim().slice(0, 12) : null
  });
}

function renderImage(){
  if (!state.lastImage) return;
  var g = parseInt(imgGrid.value, 10);
  var t = parseInt(imgThresh.value, 10);
  var inv = parseInt(imgInvert.value, 10);
  state.image.grid = g; state.image.thresh = t; state.image.style = imgStyle.value; state.image.invert = inv;
  var grid = imageToGrid(state.lastImage, g, t, inv);
  renderGrid(grid, { palette: state.palette, style: imgStyle.value });
}

/* ---------- 色板 UI ---------- */
function buildSwatches(containerId, onChange){
  var box = document.getElementById(containerId);
  box.innerHTML = "";
  PALETTE_KEYS.forEach(function(key){
    var p = PALETTES[key];
    var s = document.createElement("div");
    s.className = "swatch" + (key === state.palette ? " active" : "");
    s.style.background = "linear-gradient(135deg," + p.lit + "," + p.bg + ")";
    s.title = p.name;
    s.onclick = function(){
      state.palette = key;
      var all = box.parentNode.querySelectorAll(".swatch");
      for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
      s.classList.add("active");
      onChange();
    };
    box.appendChild(s);
  });
}

/* ---------- 画廊 ---------- */
function bitmapToGrid(rows){
  return rows.map(function(line){
    return line.split("").map(function(ch){ return (ch === "1") ? 1 : 0; });
  });
}

function buildGallery(){
  var g = document.getElementById("gallery");
  var items = [
    { label:"1024", type:"text", text:"1024" },
    { label:"芯", type:"text", text:"芯" },
    { label:"爱心", type:"bitmap", data:HEART }
  ];
  items.forEach(function(it){
    var div = document.createElement("div");
    div.className = "gitem";
    var cv = document.createElement("canvas");
    var grid = it.type === "text" ? textToGrid(it.text, 16) : bitmapToGrid(it.data);
    var cell = 10;
    cv.width = grid[0].length * cell;
    cv.height = grid.length * cell;
    var cx = cv.getContext("2d");
    cx.fillStyle = "#fff0f4"; cx.fillRect(0,0,cv.width,cv.height);
    cx.fillStyle = "#ff6b8a";
    for (var r=0;r<grid.length;r++) for (var c=0;c<grid[0].length;c++){
      if (grid[r][c]) cx.fillRect(c*cell+1, r*cell+1, cell-2, cell-2);
    }
    div.appendChild(cv);
    var span = document.createElement("span"); span.textContent = it.label;
    div.appendChild(span);
    div.onclick = function(){
      if (it.type === "text"){
        switchTab("text");
        textInput.value = it.text;
        renderText();
      } else {
        switchTab("image");
        var g2 = bitmapToGrid(it.data);
        renderGrid(g2, { palette: state.palette, style: imgStyle.value });
      }
    };
    g.appendChild(div);
  });
}

/* ---------- 标签切换 ---------- */
function switchTab(mode){
  state.mode = mode;
  var tabs = document.querySelectorAll(".tab");
  for (var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle("active", tabs[i].getAttribute("data-mode") === mode);
  }
  document.getElementById("panel-text").classList.toggle("hide", mode !== "text");
  document.getElementById("panel-image").classList.toggle("hide", mode !== "image");
  if (mode === "text") renderText(); else renderImage();
}

/* ---------- 导出 ---------- */
function exportPNG(){
  var url = preview.toDataURL("image/png");
  var a = document.createElement("a");
  var d = new Date();
  var pad = function(n){ return (n < 10 ? "0" : "") + n; };
  var name = "二进制画廊_" + (state.mode === "text" ? "文字字节画" : "图片字节画") + "_" +
             d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + ".png";
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ---------- 事件绑定 ---------- */
textInput.addEventListener("input", renderText);
textCols.addEventListener("input", renderText);
textStyle.addEventListener("change", renderText);
imgGrid.addEventListener("input", renderImage);
imgThresh.addEventListener("input", renderImage);
imgStyle.addEventListener("change", renderImage);
imgInvert.addEventListener("change", renderImage);

document.getElementById("uploadBtn").addEventListener("click", function(){ fileInput.click(); });
fileInput.addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      state.lastImage = img;
      renderImage();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(f);
});

var tabs = document.querySelectorAll(".tab");
for (var i=0;i<tabs.length;i++){
  (function(t){ t.addEventListener("click", function(){ switchTab(t.getAttribute("data-mode")); }); })(tabs[i]);
}

document.getElementById("exportBtn").addEventListener("click", exportPNG);

/* ---------- 初始化 ---------- */
buildSwatches("textSwatches", renderText);
buildSwatches("imgSwatches", function(){ if (state.mode === "image") renderImage(); else renderText(); });
buildGallery();
renderText();
</script>
</body>
</html>
